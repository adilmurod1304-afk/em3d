name: Build ChildGuard APK

on:
  push:
    branches:
      - ccr-af1f89c7-kso99v
    paths:
      - "android-childguard/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-childguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Verify bundled face model
        run: |
          f="app/src/main/assets/mobile_face_net.tflite"
          test -f "$f" || { echo "Model fayli yo'q: $f"; exit 1; }
          sz=$(stat -c%s "$f")
          echo "Model size: $sz bytes"
          [ "$sz" -gt 1000000 ] || { echo "Model juda kichik"; exit 1; }

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/childguard.jks" \
            -storepass childguard -keypass childguard -alias childguard \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ChildGuard, OU=Dev, O=ChildGuard, L=NA, ST=NA, C=UZ"

      - name: Build signed release APK
        env:
          CG_KEYSTORE: ${{ runner.temp }}/childguard.jks
          CG_STORE_PW: childguard
          CG_KEY_ALIAS: childguard
          CG_KEY_PW: childguard
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect output
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/childguard-release.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: childguard-release-apk
          path: android-childguard/out/childguard-release.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: childguard-latest
          name: ChildGuard — release
          body: |
            Bolalar ekran vaqtini yuz orqali cheklovchi ilova — IMZOLANGAN release APK.
            Telefonga o'rnatish: childguard-release.apk ni yuklab, oching.
            "Noma'lum manbalardan o'rnatish" ruxsatini yoqing.
            Batafsil: android-childguard/README.md
          files: android-childguard/out/childguard-release.apk
