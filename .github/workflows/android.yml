name: Build ChildGuard APK

on:
  push:
    branches:
      - ccr-af1f89c7-kso99v
    paths:
      - "android-childguard/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-childguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/childguard-1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: childguard-debug-apk
          path: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: childguard-latest
          name: ChildGuard — debug APK
          body: |
            Bolalar ekran vaqtini yuz orqali cheklovchi ilova (debug APK).
            Telefonda "Noma'lum manbalardan o'rnatish" ruxsatini yoqib o'rnating.
            Eslatma: yuzni tanish uchun app/src/main/assets/mobile_face_net.tflite
            modeli kerak (bo'lmasa faqat PIN ishlaydi). Batafsil: android-childguard/README.md
          files: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
