name: Build ChildGuard APK

on:
  push:
    branches:
      - ccr-af1f89c7-kso99v
    paths:
      - "android-childguard/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-childguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch & validate face model (MobileFaceNet)
        run: |
          set -e
          pip install --quiet --disable-pip-version-check ai-edge-litert numpy
          dest="app/src/main/assets/mobile_face_net.tflite"
          mkdir -p app/src/main/assets
          # repo|sha|path — har birini chindan yuklab tekshiradi
          sources=(
            "nursena-pc/nomi-ai-gallery-app|53ae5cb278cacdfaf8bf5554111e96c13cdac87c|app/src/main/assets/mobile_face_net.tflite"
            "cvlehe/claude-face-matcher|bf0e39030aef9af6aae5335efc23b56e10fb8d5d|app/src/main/assets/mobile_face_net.tflite"
            "print-ramcharan/Agentathon-228|ee2c92fb6f10e50541efb432043974e06bae1b92|android-agent/app/src/main/assets/mobile_face_net.tflite"
          )
          ok=0
          for s in "${sources[@]}"; do
            repo="${s%%|*}"; rest="${s#*|}"; sha="${rest%%|*}"; path="${rest##*|}"
            echo "::group::$repo @ ${sha:0:8}"
            rm -rf /tmp/fm
            if git clone "https://github.com/$repo.git" /tmp/fm 2>&1 | tail -1; then
              git -C /tmp/fm checkout "$sha" 2>/dev/null || true
              git -C /tmp/fm lfs pull 2>/dev/null || true
              f="/tmp/fm/$path"
              if [ -f "$f" ]; then
                echo "found $(stat -c%s "$f") bytes"
                if python3 ci/validate_model.py "$f"; then
                  cp "$f" "$dest"; ok=1; echo "ACCEPTED: $repo"; echo "::endgroup::"; break
                fi
              else
                echo "fayl yo'q: $path"
              fi
            fi
            echo "::endgroup::"
          done
          [ "$ok" = "1" ] || { echo "Yaroqli TFLite model topilmadi"; exit 1; }

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/childguard-1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: childguard-debug-apk
          path: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: childguard-latest
          name: ChildGuard — debug APK
          body: |
            Bolalar ekran vaqtini yuz orqali cheklovchi ilova (debug APK).
            Telefonda "Noma'lum manbalardan o'rnatish" ruxsatini yoqib o'rnating.
            Eslatma: yuzni tanish uchun app/src/main/assets/mobile_face_net.tflite
            modeli kerak (bo'lmasa faqat PIN ishlaydi). Batafsil: android-childguard/README.md
          files: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
