name: Build ChildGuard APK

on:
  push:
    branches:
      - ccr-af1f89c7-kso99v
    paths:
      - "android-childguard/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-childguard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Fetch face-recognition model (MobileFaceNet)
        run: |
          set -e
          dest="app/src/main/assets/mobile_face_net.tflite"
          mkdir -p app/src/main/assets
          # (repo path) juftliklari — birinchi yaroqli modelni oladi
          sources=(
            "nursena-pc/nomi-ai-gallery-app|app/src/main/assets/mobile_face_net.tflite"
            "cvlehe/claude-face-matcher|app/src/main/assets/mobile_face_net.tflite"
            "print-ramcharan/Agentathon-228|android-agent/app/src/main/assets/mobile_face_net.tflite"
          )
          ok=0
          for s in "${sources[@]}"; do
            repo="${s%%|*}"; path="${s##*|}"
            echo "::group::Trying $repo"
            rm -rf /tmp/fm
            if git clone --depth 1 "https://github.com/$repo.git" /tmp/fm 2>/dev/null; then
              git -C /tmp/fm lfs pull 2>/dev/null || true
              if [ -f "/tmp/fm/$path" ]; then
                cp "/tmp/fm/$path" "$dest"
                sz=$(stat -c%s "$dest")
                magic=$(dd if="$dest" bs=1 skip=4 count=4 2>/dev/null)
                echo "size=$sz magic=$magic"
                if [ "$sz" -gt 100000 ] && [ "$magic" = "TFL3" ]; then
                  echo "OK: $repo/$path ($sz bytes)"; ok=1; echo "::endgroup::"; break
                fi
              fi
            fi
            echo "::endgroup::"
          done
          if [ "$ok" != "1" ]; then
            echo "Yaroqli TFLite model topilmadi"; exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/childguard-1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: childguard-debug-apk
          path: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: childguard-latest
          name: ChildGuard — debug APK
          body: |
            Bolalar ekran vaqtini yuz orqali cheklovchi ilova (debug APK).
            Telefonda "Noma'lum manbalardan o'rnatish" ruxsatini yoqib o'rnating.
            Eslatma: yuzni tanish uchun app/src/main/assets/mobile_face_net.tflite
            modeli kerak (bo'lmasa faqat PIN ishlaydi). Batafsil: android-childguard/README.md
          files: android-childguard/app/build/outputs/apk/debug/childguard-1.0-debug.apk
