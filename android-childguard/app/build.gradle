plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'uz.namdpi.childguard'
    compileSdk 34

    defaultConfig {
        applicationId "uz.namdpi.childguard"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4"
        // APK hajmini kichraytirish: faqat keng tarqalgan ABI'lar
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Imzolash: CI muhit o'zgaruvchilaridan keystore o'qiydi; bo'lmasa debug kaliti
    signingConfigs {
        release {
            def ks = System.getenv("CG_KEYSTORE")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("CG_STORE_PW")
                keyAlias System.getenv("CG_KEY_ALIAS")
                keyPassword System.getenv("CG_KEY_PW")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv("CG_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    // TFLite modelini siqib yubormaslik uchun (memory-map qilish uchun zarur)
    aaptOptions {
        noCompress 'tflite'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'

    // CameraX
    def cameraxVersion = "1.3.4"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    // ML Kit yuz aniqlash (yuzni topib, kesib olish uchun)
    implementation 'com.google.mlkit:face-detection:16.1.7'

    // TensorFlow Lite (yuz embedding / tanib olish uchun)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}
